<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mango compares retrieval-based spoken question answering pipelines: browse the experiments, their quality and cost, and cached answers to spoken finance questions."
    />
    <!-- not for search engines; the static site also sends X-Robots-Tag (public/_headers) -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- link previews (Open Graph: Telegram, WhatsApp, Slack, LinkedIn, …; Twitter card for X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mango" />
    <meta property="og:title" content="Mango: spoken question answering, measured stage by stage" />
    <meta
      property="og:description"
      content="Retrieval methods for spoken question answering compared on quality and cost: experiments, results and cached answers."
    />
    <meta property="og:url" content="https://mango.benyaminbeyzaei.fyi/" />
    <meta property="og:image" content="https://mango.benyaminbeyzaei.fyi/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Mango logo with the line: spoken question answering, retrieval methods compared on quality and cost" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#e9a23b" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Mango</title>
    <script>
      // Set the theme before the first paint, so dark mode does not flash white
      // (the same rule as ThemeProvider: the saved choice, else the system's).
      try {
        var t = localStorage.getItem("theme")
        if (t !== "dark" && t !== "light")
          t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        document.documentElement.classList.add(t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
