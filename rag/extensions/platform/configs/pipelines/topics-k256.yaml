# Topics pipeline (mlsrag preprocess run --pipeline topics|toc|raptor|raptor-tree --config <this file>).
# One section per stage; each section is part of that stage's hash.
select: {mode: all}
cluster: {k: 256}
label: {model: meta-llama/Llama-3.3-70B-Instruct}
topic_index: {}
# toc: the 256 topics grouped into 16 sections, one LLM label per section
section: {n: 16, model: meta-llama/Llama-3.3-70B-Instruct}
toc_index: {}
# raptor: one summary per cluster from its 8 records nearest the centroid (400 chars each)
summarise: {model: meta-llama/Llama-3.3-70B-Instruct, members: 8, chars: 400, words: 120}
summary_index: {encoder: gte-small}
# raptor-tree: soft membership for about 15 % of records, one summary per cluster from
# all its members (split above 24k tokens, then combined), one per section, one index over both
soft_members: {share: 0.15}
summarise_full: {model: meta-llama/Llama-3.3-70B-Instruct, words: 150, max_input_tokens: 24000, max_calls: 450}
section_summarise: {model: meta-llama/Llama-3.3-70B-Instruct, words: 150}
tree_index: {encoder: gte-small}
