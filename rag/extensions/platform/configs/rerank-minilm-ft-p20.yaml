# RunConfig (plan 035): rerank-minilm-p20 with the cross-encoder fine-tuned on the practice labels
# (python -m mlsrag.finetune, see docs/retrievers.md "Fine-tuned reranker"). The weights are not in git:
# rebuild them into rag/.cache/models/rerank-minilm-ft before running.
name: rerank-minilm-ft-p20
asr: cached
asr_cache: rag/.cache/transcripts/whisper1-practice.jsonl
query_encoder: gte-small
corpus_index: enc_a
retriever: rerank
k: 5
params:
  base: exact
  pool: 20
  model: rag/.cache/models/rerank-minilm-ft
