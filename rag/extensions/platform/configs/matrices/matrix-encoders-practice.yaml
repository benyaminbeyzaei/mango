# Matrix C (practice, 350 questions): what does a different encoder for the queries cost in retrieval?
# Variable: the encoder mismatch policy (gte-small queries against the enc_b index); baseline = gte-small on enc_a.
# Retrieval only, no LLM call at query time: run with --allow-full --no-generate --fresh.
# Controls (same in every row): whisper-1 transcript cache (rag/.cache/transcripts/whisper1-<split>.jsonl),
# retriever exact, k=5, standard flow. The lstsq/procrustes maps were fitted offline (mlsrag fit-map).
# The summary gives a 95 % bootstrap interval (1,000 resamples over queries, seed 0) for Recall@10 and NDCG@10.
# Only summary.{md,json} is committed; the run folders it names stay local.
# Settings are chosen on this split; the test matrix only reports them.
name: encoders-practice
subset: practice
configs: [baseline, enc-b-asis, enc-b-reencode, enc-b-reencode-prefix, enc-b-translate-lstsq, enc-b-translate-procrustes]
